        gtag('config', 'G-FMCYFTFPEL');

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9715826188316382"
        crossorigin="anonymous"></script>

    <link rel="manifest" href="/manifest.json" />

    <meta charset="utf-8">
    <title>Weather | Malaysia Boleh</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Bawa payung ke? Live 7-day MET Malaysia forecasts by district and active weather warnings, via data.gov.my.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Weather | Malaysia Boleh" />
    <meta property="og:site_name" content="UwU Apps" />
    <meta property="og:description" content="Bawa payung ke? Live 7-day MET Malaysia forecasts by district and active weather warnings, via data.gov.my." />
    <meta property="og:url" content="https://malaysia.uwuapps.org/weather/" />
    <link rel="canonical" href="https://malaysia.uwuapps.org/weather/">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/weather/weather.css">
    <meta name="theme-color" content="#ccffcc" />

    <!-- Embed Image -->
    <link rel="apple-touch-icon" href="/MYB-main.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image:src" content="/MYB-main.png">
    <meta property="og:image" content="/MYB-main.png" />

<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand-mark" href="/">
                <img src="/MYB-main.png" alt="Malaysia Boleh logo">
                <span>Malaysia Boleh</span>
            </a>
            <div class="topbar-spacer"></div>
            <div class="topbar-actions">
                <a id="coffeeButton" class="btn btn-coffee" href="https://donate.stripe.com/28o2akeAr3hv0DK6oo"
                    target="_blank" rel="noopener noreferrer"></a>
                <button id="themeToggle" class="btn" type="button"></button>
            </div>
        </div>
    </header>

    <main class="container">
        <a class="back-link" href="/">&larr; Back to Directory</a>

        <section class="hero weather-hero">
            <h1>Bawa payung ke?</h1>
            <p>Live 7-day forecasts by district and active weather warnings from MET Malaysia, via data.gov.my.</p>
        </section>

        <section class="glass umbrella-card" id="umbrellaCard" aria-live="polite">
            <div class="umbrella-icon" id="umbrellaIcon"></div>
            <div class="umbrella-body">
                <p class="umbrella-headline" id="umbrellaHeadline">Loading today's outlook&hellip;</p>
                <p class="umbrella-sub" id="umbrellaSub">Fetching the latest forecast.</p>
            </div>
        </section>

        <div class="weather-toolbar">
            <label class="location-picker">
                <span>District</span>
                <select id="locationSelect" aria-label="Select district">
                    <option value="">All districts</option>
                </select>
            </label>
            <div class="toolbar-right">
                <span class="last-updated" id="lastUpdated"></span>
                <button class="btn" id="refreshBtn" type="button">
                    <span id="refreshIcon"></span>
                    <span class="btn-label">Refresh</span>
                </button>
            </div>
        </div>

        <div id="forecastState"></div>
        <section class="forecast-grid" id="forecastGrid"></section>

        <h2 class="section-title">Active warnings</h2>
        <div id="warningState"></div>
        <section class="warning-list" id="warningList"></section>
    </main>

    <footer class="site-footer">
        <p>Built by UwU Apps &middot; Data via <a href="https://data.gov.my" target="_blank"
                rel="noopener noreferrer">data.gov.my</a></p>
    </footer>

    <script src="/js/icons.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/weather/weather.js"></script>
</body>

</html>
